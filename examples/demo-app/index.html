<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Console — Sign in</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <div class="brand"><span class="dot"></span> Acme Console</div>
        <h1>Sign in</h1>
        <p class="muted">Use the email address your invitation was sent to.</p>

        <form id="signin">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required />

          <label class="checkbox">
            <input id="remember" type="checkbox" />
            Keep me signed in
          </label>

          <button type="submit">Sign in</button>
          <p class="error" id="error" hidden>Check your email and password, then try again.</p>
        </form>

        <p class="muted small"><a href="#reset">Reset password</a></p>
      </section>
    </main>

    <script>
      document.getElementById('signin').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!email || password.length < 4) {
          document.getElementById('error').hidden = false;
          return;
        }
        sessionStorage.setItem('acme-user', email);
        location.href = 'dashboard.html';
      });
    </script>
  </body>
</html>
